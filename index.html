<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>5inco Store – Sistema de Gestión</title>
  <meta name="description" content="Sistema de gestión para local de ropa. Control de ventas, stock, empleados y deudores." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d0f14" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Lucide Icons (SVG icon set) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>



<button id="theme-toggle" class="btn-theme-toggle" title="Cambiar tema">
  <span class="theme-icon">
    <i data-lucide="moon" style="width:16px;height:16px;"></i>
  </span>
</button>

<!-- ═══════════════════════════ LOGIN ═══════════════════════════ -->
<div id="page-login" class="page active">
  <div class="login-bg" style="display:flex; align-items:center; justify-content:center; min-height:100vh; background: linear-gradient(135deg, var(--bg2) 0%, var(--bg) 100%);">
    <div class="netflix-pin-card premium-login-card">
      <div style="text-align: center; margin-bottom: 32px;">
        <img src="LOGO PNG.png" alt="5inco Logo" class="premium-login-logo">
        <h2 style="font-size: 24px; font-weight: 700; color: var(--text); margin-top: 16px; margin-bottom: 8px;">Bienvenido</h2>
        <p class="text-muted" style="font-size: 14px;">Ingresá con tu correo electrónico para continuar</p>
      </div>
      
      <form id="email-login-form">
        <div class="form-group premium-form-group">
          <label style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-2);">Correo Electrónico</label>
          <div class="premium-input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="premium-input-icon"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
            <input type="email" id="login-email" placeholder="Ingresá tu correo" required autofocus autocomplete="off" class="premium-input" />
          </div>
        </div>
        <div class="form-group premium-form-group" style="margin-top: 20px;">
          <label style="font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-2);">Contraseña</label>
          <div class="premium-input-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="premium-input-icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" id="login-pass" placeholder="••••••••" required autocomplete="current-password" class="premium-input" />
          </div>
        </div>
        <div id="login-error" class="alert-error" style="display:none; margin-top: 16px; font-size: 13px; border-radius: 8px;"></div>
        <button type="submit" class="btn btn-primary btn-full premium-login-btn">
          Ingresar al Sistema <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left:8px;"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>
    </div>
  </div>
</div>

<!-- ═══════════════════════════ APP SHELL ═══════════════════════════ -->
<div id="page-app" class="page">

  <!-- Mobile Header -->
  <div class="mobile-header" id="mobile-header">
    <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir menú">☰</button>
    <div class="mobile-logo" style="display: flex; align-items: center; gap: 8px;">
      <img src="logo.png" alt="Logo" style="width: 24px; height: 24px; border-radius: 4px; object-fit: cover;" />
      <span class="logo-text" style="font-size: 18px; letter-spacing: -0.5px; font-weight: bold;">
        <span style="color: #786a55">Stack</span><span style="background: linear-gradient(135deg, #c4a882 0%, #8b7355 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent; font-weight: 900;">Hard</span>
      </span>
    </div>
    <div class="mobile-user-name" id="mobile-user-name"></div>
  </div>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo" style="display: flex; flex-direction: column; align-items: flex-start; padding: 24px 16px;">
        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
          <img src="logo.png" alt="StackHard" style="width: 40px; height: 40px; border-radius: 8px; object-fit: cover;" />
          <span class="logo-text" style="font-size: 20px; letter-spacing: -0.5px; font-weight: bold;">
            <span style="color: #786a55">Stack</span><span style="background: linear-gradient(135deg, #c4a882 0%, #8b7355 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; color: transparent; font-weight: 900;">Hard</span>
          </span>
        </div>
        <span style="font-size: 9px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; line-height: 1.2;">
          INGENIERÍA DE SISTEMAS &<br>ARQUITECTURA DE SOFTWARE
        </span>
      </div>
    </div>

    <div class="sidebar-user" id="sidebar-user-info"></div>

    <nav class="sidebar-nav" id="sidebar-nav"></nav>

    <div class="sidebar-footer">
      <button class="btn-logout" id="btn-logout" style="display:flex;align-items:center;gap:8px;">
        <i data-lucide="log-out" style="width:14px;height:14px;"></i>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content" id="main-content">
    <!-- Views injected here -->
  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
    <div class="mobile-nav-items" id="mobile-nav-items">
      <!-- Rendered dynamically in app.js -->
    </div>
  </nav>

</div>

<!-- ═══════════════════════════ MODALS ═══════════════════════════ -->
<div id="modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box" id="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Modal</h3>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js?v=4"></script>
<script src="app.js?v=4"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(registration => {
        console.log('SW registrado con éxito:', registration.scope);
      }).catch(err => {
        console.log('Fallo el registro del SW:', err);
      });
    });
  }
</script>
</body>
</html>
